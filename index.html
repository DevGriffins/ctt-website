<!doctype html>
<html lang="en" data-accent="blue">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#201F1E" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--app-head--><title>Celotti Tech Talent</title><!--/app-head-->
    <script>
      /* Review toggle for the blue accent: applied before first paint. ?accent=off or ?accent=blue also works. */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("accent");
          var s = q || localStorage.getItem("ctt-accent");
          if (s === "off") document.documentElement.removeAttribute("data-accent");
          else if (s === "blue") document.documentElement.setAttribute("data-accent", "blue");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
